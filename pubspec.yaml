name: turrets_defend
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.39+40

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  flame: ^1.20.0
  shared_preferences: ^2.3.3
  flame_audio: ^2.10.0
  http: ^1.2.0
  flutter_inappwebview: ^6.1.5
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1
  wakelock_plus: ^1.8.0

# flutter_inappwebview_android 1.1.3's own android/build.gradle calls
# getDefaultProguardFile('proguard-android.txt'), which AGP 9 (this project's
# AGP version, see android/settings.gradle.kts) hard-rejects. Vendored a
# locally-patched copy (one-line fix) at third_party/ until upstream ships a
# fix for AGP 9 — see third_party/flutter_inappwebview_android/android/build.gradle.
dependency_overrides:
  flutter_inappwebview_android:
    path: third_party/flutter_inappwebview_android

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#000000"
  image: assets/logo/splash_logo.png
  android_12:
    color: "#000000"
    image: assets/logo/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/splash_logo.png"
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/audio/
    - assets/images/backgrounds/
    - assets/images/enemies/fly/flyingblue/
    - assets/images/enemies/fly/flyingbrown/
    - assets/images/enemies/fly/flyingorange/
    - assets/images/enemies/ground/blackbeetle/
    - assets/images/enemies/ground/bluebeetle/
    - assets/images/enemies/ground/darkbeetle/
    - assets/images/enemies/ground/greenbeetle/
    - assets/images/enemies/ground/hornbeetle/
    - assets/images/enemies/ground/orangebeetle/
    - assets/images/enemies/ground/purplebeetle/
    - assets/images/enemies/ground/redbeetle/
    - assets/images/enemies/hybrid/hybridblue/
    - assets/images/enemies/hybrid/hybridgreen/
    - assets/images/enemies/hybrid/hybridpur/
    - assets/images/enemies/hybrid/hybridred/
    - assets/images/explosion1/
    - assets/images/explosion2/
    - assets/images/ground/
    - assets/images/projectile/
    - assets/images/shootfx/
    - assets/images/turrets/t1/
    - assets/images/turrets/t2/
    - assets/images/turrets/t3/
    - assets/images/turrets/t4/
    - assets/images/turrets/t5/
    - assets/images/turrets/t6/
    - assets/images/turrets/t7/
    - assets/images/turrets/t8/
    - assets/images/turrets/t9/
    - assets/images/turrets/t10/
    - assets/images/turrets/t11/
    - assets/images/turrets/t12/
    - assets/images/turrets/t13/
    - assets/images/turrets/t14/
    - assets/images/turrets/t15/
    - assets/images/turrets/t16/
    - assets/images/turrets/t17/
    - assets/images/turrets/t18/
    - assets/images/turrets/t19/
    - assets/images/turrets/t20/
    - assets/images/ui/
    - assets/images/shop/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Matches the two display fonts already used in the game's own logo
  # (assets/logo/logo_turret.png): the chunky "DEFENSE TURRETS" wordmark is
  # Russo One (only comes in one weight, already bold/blocky), and the
  # "ENDLESS MODE" banner is Oswald Bold (a variable font — declaring the
  # same file at two weights lets FontWeight.w400/w700 pick the right
  # instance). RussoOne is used for titles/buttons/menu labels (uppercase);
  # Oswald for body copy (guide, shop descriptions, etc.) — see
  # lib/theme/app_fonts.dart for the actual TextStyle helpers.
  fonts:
    - family: RussoOne
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 400
        - asset: assets/fonts/Oswald-Variable.ttf
          weight: 700
